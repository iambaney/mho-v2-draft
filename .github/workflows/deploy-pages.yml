# Proof-of-concept deploy: both branches build to one GitHub Pages site.
#   main  -> https://<user>.github.io/<repo>/
#   draft -> https://<user>.github.io/<repo>/draft/
# Runs on every push to either branch, and when publish.yml starts it for main.
# The Dreamhost version of this file (deploy-dreamhost.yml.example) is identical
# up to the last step.
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, draft]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the edit page lists the content file's history

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Settings for this branch
        id: base
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"
            echo "dest=." >> "$GITHUB_OUTPUT"
          else
            echo "path=/${GITHUB_REPOSITORY#*/}/draft/" >> "$GITHUB_OUTPUT"
            echo "dest=draft" >> "$GITHUB_OUTPUT"
          fi
          echo "content_sha=$(git rev-parse HEAD:content/home.json)" >> "$GITHUB_OUTPUT"

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
          CONTENT_SHA: ${{ steps.base.outputs.content_sha }}   # lets the relay notice a stale edit page
          RELAY_URL: ${{ vars.RELAY_URL }}                      # where Save and Publish go; unset means a relay on localhost

      - name: Leave the edit page out of the live site
        if: github.ref_name == 'main'
        run: rm -rf dist/edit

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: ${{ steps.base.outputs.dest }}
          keep_files: true   # so the main and draft builds do not erase each other
