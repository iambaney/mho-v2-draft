meet:
  eyebrow: Meet Anya
  headline: You are not broken. You may be running an old pattern.
  paragraphs:
    - Anya Mayer, CHT has spent 25 years helping people quiet an overwhelmed
      nervous system and loosen the grip of patterns that once protected them.
      She combines hypnotherapy, NLP, and mind-body awareness — roots that go
      back to her work as a massage therapist.
    - "Every engagement starts the same way: a free 20-minute conversation, no
      pressure, to find out whether this is the right fit."
